    name: "Wave Rotate"
    update_interval: 75ms
    lambda: |-
      static float wave_position = 0.0;
      const int x = 10;  // Width of the wave peak
      const int y = 20;  // Spacing between wave peaks
      const float wave_speed = 0.5;  // Speed of the wave progression


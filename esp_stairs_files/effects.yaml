- addressable_lambda:
    name: Blue Fire
    update_interval: 50ms
    lambda: |-
      for (uint16_t i = 0; i < it.size(); i++) {
        float brightness = (it.size()/2 - abs(it.size()/2 - i)) / (float)(it.size()/2);

        // Add some "white-ish sparkles"
        uint8_t whiteness = random(64 * brightness);

        // Dominant blue: base + brightness-dependent boost
        uint8_t blueness = random(64) + random(127 * brightness);


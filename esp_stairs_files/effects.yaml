- addressable_lambda:
    name: Flames Vertical Right
    update_interval: 35ms
    lambda: |-
      // You may adjust the following two variables as well as the update_interval to fit your needs
      const uint8_t Cooling  = 55;
      const uint8_t Sparking = 110;

      static std::vector<uint8_t> heat(it.size(), 0);
      int cooldown;

      for (uint16_t i = 0; i < it.size(); i++) {
        uint32_t cooldown_range = ((Cooling * 10) / it.size()) + 2;
        cooldown = esphome::random_uint32() % cooldown_range;
        if (cooldown > heat[i]) {
          heat[i] = 0;
        } else {
          heat[i] -= cooldown;
        }
      }

      for (int k = it.size() - 1; k >= 2; k--) {
        heat[k] = (heat[k - 1] + heat[k - 2] + heat[k - 2]) / 3;
      }

      if ((esphome::random_uint32() % 256) < Sparking) {
        int spark_limit = std::min((int)(it.size() / 10), 7);
        int y = esphome::random_uint32() % spark_limit;
        int add_heat = (esphome::random_uint32() % (256 - 160)) + 160;
        heat[y] = std::min(255, heat[y] + add_heat);
      }

      for (uint16_t Pixel = 0; Pixel < it.size(); Pixel++) {
        uint8_t t192 = round((heat[Pixel] / 255.0) * 191);
        uint8_t heatramp = (t192 & 0x3F) << 2;

        if (t192 > 0x80) {
          it[it.size() - Pixel - 1] = Color(255, 255, heatramp);
        } else if (t192 > 0x40) {
          it[it.size() - Pixel - 1] = Color(255, heatramp, 0);
        } else {
          it[it.size() - Pixel - 1] = Color(heatramp, 0, 0);
        }
      }


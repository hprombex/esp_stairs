          {
            int center = static_cast<int>(position_f);
            int num_sparkles = 30 + rand() % 21; // Random number of sparkles between 30 and 50
            for (int i = 0; i < num_sparkles; i++) {
              int index = center + (rand() % (2 * explosion_step + 1)) - explosion_step;
